<title>Pixel Ocean</title>

<style>
body{margin:0;background:#081226;color:#9fefff;font-family:"Courier New",monospace;display:flex;justify-content:center}
#a{width:100%;max-width:720px;padding:12px;box-sizing:border-box}

.on{background:#123f66!important;border-color:#5fd0ff!important;color:#fff!important}
.panel{border:1px solid #2a4a6a;background:#0b1830;padding:10px;margin:10px 0;color:#cfeaff;font-size:14px;line-height:1.5}
.big{font-size:17px;min-height:52px;font-weight:bold;letter-spacing:1px}
.center{text-align:center}
.small{font-size:12px;color:#8fb6cc}
.dim{opacity:.55}
canvas.pix{image-rendering:pixelated}
.player-card{display:flex;gap:12px;align-items:center;border:1px solid #2a5a4a;padding:8px;margin:8px 0;color:#fff;font-size:13px;background:#0b1830}
.cbadge{display:inline-block;border:1px solid;border-radius:3px;padding:0 4px;font-size:9px;letter-spacing:1px;vertical-align:1px}
.cstat{text-align:center;background:#0a2540;padding:2px 0 6px;font-size:10px}
.cardphoto{width:216px;height:150px;object-fit:cover;border-radius:3px;display:block;margin:0 auto;background:#08233d}
.photocred{font-size:9px;color:#8fb6cc;margin-top:2px;line-height:1.3}
.photocred a{color:#8fb6cc}
.dphoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.mphoto{width:100%;height:100%;object-fit:cover;border-radius:4px}
.qphoto{width:64px;height:48px;object-fit:cover;border-radius:4px;display:block}
.sortphoto{width:180px;height:135px;object-fit:cover;border-radius:4px;margin:0 auto;display:block;background:#08233d}

.card3d{position:relative;width:252px;height:328px;margin:8px auto;transform-style:preserve-3d;transition:transform .55s}
.card3d.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #d9c48a;border-radius:10px;overflow:hidden;background:#071c33;color:#fff}
.cface-b{transform:rotateY(180deg)}

.cnum{color:#ffd23f;font-weight:bold}

.tbtn{font-size:11px;min-height:30px}

.opt{display:block;width:100%;margin:7px 0;min-height:48px;font-size:15px}
.ok{background:#0a3a1a!important;border-color:#3dff6e!important;color:#3dff6e!important}
.no{background:#2a1408!important;border-color:#e0483a!important;color:#ff9a7a!important}
.clue{border-left:3px solid #ffd23f;padding:6px 10px;margin:6px 0;background:#0d1e3a;font-size:14px;color:#fff}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.catgrid button{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:6px 10px;font-size:14px}

.mgrid{display:grid;gap:6px;margin-top:8px}
.mcard{aspect-ratio:3/4;border:2px solid #2a4a6a;border-radius:6px;background:repeating-linear-gradient(45deg,#0d2f4f,#0d2f4f 8px,#123f66 8px,#123f66 16px);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.mcard.open{background:#071c33;border-color:#d9c48a}

.ico{width:18px;height:18px;flex-shrink:0}
.zcard{border:1px solid #2a4a6a;background:#0b1830;margin:8px 0;padding:10px}
.zcard h3{margin:2px 0;color:#7fd8ff;font-size:16px}
.zbar{height:6px;background:#0d1e3a;border:1px solid #2a4a6a;margin-top:6px}
.zbar i{display:block;height:100%;background:#3dff6e}
kbd{border:1px solid #2a4a6a;padding:0 4px;font-size:11px}
.csrc{font-size:9px;color:#5f86a0;margin:4px 0 0}
.srcs summary{cursor:pointer;color:#7fd8ff;font-weight:bold;margin:8px 0}
.srcline{font-size:11px;margin:2px 0}
.srcline a{color:#9fefff;text-decoration:none}
</style></head>

function cardEl(sp){
 var fz=el("div","flipzone");
 var c=el("div","card3d");
 var front=el("div","face cface-f");
 front.appendChild(el("div","cseries",'<span>OCEAN EXPLORERS</span><span class="cnum">'+cardNum(sp)+'</span>'));

 front.appendChild(art);
 front.appendChild(el("div","cname",sp.n));
 front.appendChild(el("div","csub",stars(sp.rar)+" &nbsp;"+CATS[sp.cat]+" &middot; "+ZONES[sp.z].n));
 front.appendChild(el("div","cstat",iucnPill(sp)+' <span class="small">tap to flip</span>'));
 var backf=el("div","face cface-b");
 var bb=el("div","cback");
 bb.appendChild(el("h3",null,sp.n));
 bb.appendChild(el("div","sci",sp.sci));
 bb.appendChild(el("p",null,'<span class="lab">Group:</span> '+CATS[sp.cat]));
 bb.appendChild(el("p",null,'<span class="lab">Home:</span> '+ZONES[sp.z].n));
 bb.appendChild(el("p",null,'<span class="lab">Size:</span> '+sp.size));
 bb.appendChild(el("p",null,'<span class="lab">Depth:</span> '+sp.depth));
 bb.appendChild(el("p",null,'<span class="lab">Eats:</span> '+sp.diet));
 bb.appendChild(el("p",null,'<span class="lab">Extinction risk:</span> '+iucnLine(sp)));
 bb.appendChild(el("p","cfact",sp.fact));
 bb.appendChild(el("p","csrc","Source: "+srcOf(sp)[0]));

 backf.appendChild(bb);
 c.appendChild(front);c.appendChild(backf);fz.appendChild(c);
 fz.onclick=function(){c.classList.toggle("flip");sfx("flip")};

}

<script>
"use strict";
/* ---------- expedition ---------- */
var D=null;
function stopDive(){if(D&&D.raf)cancelAnimationFrame(D.raf);D=null}
function scrDive(scr,zi){
 if(!zoneUnlocked(zi)){go("zones");return}
 var z=ZONES[zi],spz=zoneSp(zi);
 scr.appendChild(el("h2",null,z.n.toUpperCase()+" &middot; DIVE"));
 var wrap=el("div","",null);wrap.id="divewrap";
 var cv=mkCan(380,460);cv.id="dive";wrap.appendChild(cv);
 var toast=el("div","toast");wrap.appendChild(toast);
 var overlay=el("div","center");overlay.style.cssText="position:absolute;inset:0;background:#04101cd9;display:none;overflow:auto;padding:10px;box-sizing:border-box;z-index:6";
 wrap.appendChild(overlay);
 scr.appendChild(wrap);
 var hud=el("div","hud");
 var tgts={};
 var uncol=shuffle(spz.filter(function(s){return!S.got[s.id]}));
 var col=shuffle(spz.filter(function(s){return S.got[s.id]}));
 var targets=uncol.concat(col).slice(0,6);
 targets.forEach(function(sp){
  var t=el("div","tg");var tc=mkCan(44,32);var g=tc.getContext("2d");g.imageSmoothingEnabled=false;
  g.drawImage(spr(sp,true),0,0,44,31);t.appendChild(tc);
  t.title=sp.n;hud.appendChild(t);tgts[sp.id]=t;
 });
 var airW=el("div","airbar");var airF=el("i");airW.appendChild(airF);hud.appendChild(airW);
 scr.appendChild(hud);
 scr.appendChild(el("div","small center","Tap any living thing to scan it. Scan all 6 targets before your air runs out to clear the dive."));
 var g=cv.getContext("2d");g.imageSmoothingEnabled=false;
 var decor=[];
 var floorSp=spz.filter(function(s){return FLOOR_PLANS[s.plan]});
 shuffle(floorSp).slice(0,4).forEach(function(sp,i){
  decor.push({sp:sp,x:50+i*95+(i%2?20:-10),y:430-(sp.plan==="kelp"?30:0),sc:1.7});
 });
 var W=380,H=460;
 D={raf:0,zi:zi,z:z,air:95,t:0,swim:[],spawnT:0,scan:null,done:{},sub:{x:90,y:230},targets:targets,over:false,paused:false,toast:toast,overlay:overlay,tgts:tgts,airF:airF,decor:decor};
 function spawn(){
  if(D.swim.length>=7)return;
  var pool=[];
  var rem=D.targets.filter(function(sp){return!D.done[sp.id]&&!FLOOR_PLANS[sp.plan]&&!D.swim.some(function(c){return c.sp.id===sp.id})});
  var movers=spz.filter(function(s){return !FLOOR_PLANS[s.plan]});
  if(rem.length&&Math.random()<.6)pool.push(rem[(Math.random()*rem.length)|0]);
  else pool.push(movers[(Math.random()*movers.length)|0]);
  var sp=pool[0];if(!sp)return;
  var dir=Math.random()<.5?1:-1;
  var y=AIR_PLANS[sp.plan]?40+Math.random()*70:80+Math.random()*300;
  var rare=sp.rar===3;
  D.swim.push({sp:sp,x:dir>0?-70:W+70,y:y,vx:dir*(rare?52:22+Math.random()*22),sc:rare?1.35:1.55,ph:Math.random()*6.28});
 }
 function showToast(msg){D.toast.textContent=msg;D.toast.style.display="block";clearTimeout(D.toastT);D.toastT=setTimeout(function(){if(D)D.toast.style.display="none"},1600)}
 function popup(sp,isNew){
  D.paused=true;
  var ov=D.overlay;ov.innerHTML="";ov.style.display="block";
  ov.appendChild(el("div",null,'<h2 style="margin:2px">'+(isNew?"NEW DISCOVERY!":"LOGGED AGAIN")+"</h2>"));
  ov.appendChild(cardEl(sp));
  var r=el("div","row");var b=el("button","big","Keep diving");
  b.onclick=function(){ov.style.display="none";D.paused=false;if(allDone())finish(true)};
  r.appendChild(b);ov.appendChild(r);
 }
 function allDone(){return D.targets.every(function(sp){return D.done[sp.id]})}
 function finish(cleared){
  if(D.over)return;D.over=true;
  if(cleared){S.clears[D.z.id]=(S.clears[D.z.id]||0)+1;save();sfx("clear")}else sfx("no");
  var ov=D.overlay;ov.innerHTML="";ov.style.display="block";
  ov.appendChild(el("h2",null,cleared?"DIVE CLEARED!":"OUT OF AIR"));
  var got=D.targets.filter(function(sp){return D.done[sp.id]}).length;
  ov.appendChild(el("div","panel","Targets scanned: "+got+" / 6.<br>Clears in "+D.z.n+": "+(S.clears[D.z.id]||0)+" / 3."+
   (cleared&&(S.clears[D.z.id]>=3)&&D.zi<5?"<br><b>"+ZONES[D.zi+1].n+" unlocked!</b>":"")));
  var r1=el("div","row");var b1=el("button","big","Dive again");b1.onclick=function(){render("dive",D?D.zi:0)};r1.appendChild(b1);
  var b2=el("button","big","Choose zone");b2.onclick=function(){go("zones")};r1.appendChild(b2);
  ov.appendChild(r1);
  var r2=el("div","row");var b3=el("button",null,"Open card deck");b3.onclick=function(){go("deck")};r2.appendChild(b3);ov.appendChild(r2);
 }
 function collect(sp){
  var isNew=!S.got[sp.id];
  S.got[sp.id]=1;save();
  if(D.targets.some(function(t){return t.id===sp.id})){D.done[sp.id]=1;
   var tg=D.tgts[sp.id];if(tg){tg.classList.add("done");var tc=tg.firstChild;var gg=tc.getContext("2d");gg.imageSmoothingEnabled=false;gg.drawImage(spr(sp),0,0,44,31)}}
  sfx("scan");
  if(D.targets.some(function(t){return t.id===sp.id}))popup(sp,isNew);
  else showToast("Logged: "+sp.n+(isNew?" (new card)":""));
 }
 cv.addEventListener("pointerdown",function(e){
  if(!D||D.paused||D.over)return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  D.sub.tx=x;D.sub.ty=y;
  var best=null,bd=40;
  D.swim.forEach(function(c){var d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;best=c}});
  D.decor.forEach(function(c){var d=Math.hypot(c.x-x,c.y-(c.sp.plan==="kelp"?400:430));if(d<bd+8){bd=d;best={sp:c.sp,x:c.x,y:c.y,deco:true}}});
  if(best&&!D.scan){D.scan={c:best,p:0}}
 });
 var last=0;
 function frame(ts){
  if(!D)return;
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!D.paused&&!D.over){
   D.t+=dt;D.air-=dt;
   if(D.air<=0){D.air=0;finish(allDone())}
   D.spawnT-=dt;if(D.spawnT<=0){spawn();D.spawnT=.9+Math.random()*.8}
   D.swim.forEach(function(c){c.x+=c.vx*dt;c.ph+=dt*2;c.y+=Math.sin(c.ph)*.3});
   D.swim=D.swim.filter(function(c){return c.x>-90&&c.x<W+90});
   if(D.sub.tx!=null){D.sub.x+=(D.sub.tx-D.sub.x)*3*dt;D.sub.y+=(D.sub.ty-D.sub.y)*3*dt}
   D.sub.x=Math.max(40,Math.min(W-40,D.sub.x));D.sub.y=Math.max(60,Math.min(H-60,D.sub.y));
   if(D.scan){D.scan.p+=dt/0.9;
    if(D.scan.c.deco){/* static */}
    else{D.scan.c.vx*=Math.pow(.02,dt)}
    if(D.scan.p>=1){var sp=D.scan.c.sp;D.swim=D.swim.filter(function(c){return c!==D.scan.c});D.scan=null;collect(sp)}}
  }
  draw(g);
  D.airF.style.width=(D.air/95*100)+"%";
  D.airF.style.background=D.air<20?"#ff5d6a":"";
  D.raf=requestAnimationFrame(frame);
 }
 function draw(g){
  var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,D.z.top);gr.addColorStop(1,D.z.bot);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.globalAlpha=.12;g.fillStyle="#fff";
  for(var i=0;i<3;i++){g.beginPath();g.moveTo(60+i*120,0);g.lineTo(110+i*120,0);g.lineTo(60+i*120,H);g.lineTo(-10+i*120,H);g.fill()}
  g.globalAlpha=1;
  g.fillStyle=D.z.floor;g.fillRect(0,442,W,18);
  D.decor.forEach(function(c){
   var yy=c.sp.plan==="kelp"?442-56*c.sc*0+0:442;
   var h=56*c.sc,w=80*c.sc;
   g.drawImage(spr(c.sp),c.x-w/2,442-h,w,h);
   if(D.targets.some(function(t){return t.id===c.sp.id})&&!D.done[c.sp.id]){g.strokeStyle="#ffd23f";g.lineWidth=2;g.strokeRect(c.x-w/2-3,442-h-3,w+6,h+6)}
  });
  D.swim.forEach(function(c){
   var w=80*c.sc,h=56*c.sc,bob=Math.sin(c.ph)*3;
   g.save();g.translate(c.x,c.y+bob);
   if(c.vx<0){g.scale(-1,1)}
   g.drawImage(spr(c.sp),-w/2,-h/2,w,h);
   g.restore();
   if(D.targets.some(function(t){return t.id===c.sp.id})&&!D.done[c.sp.id]){
    g.strokeStyle="#ffd23f";g.lineWidth=2;g.beginPath();g.arc(c.x,c.y+bob,30,0,7);g.stroke()}
  });
  if(D.scan){var c=D.scan.c;
   g.strokeStyle="#7fd8ff";g.lineWidth=3;
   g.beginPath();g.moveTo(D.sub.x,D.sub.y);g.lineTo(c.x,c.y);g.stroke();
   g.strokeStyle="#3dff6e";g.lineWidth=4;g.beginPath();g.arc(c.x,c.y,34,-Math.PI/2,-Math.PI/2+D.scan.p*6.283);g.stroke();
  }
  drawSub(g,D.sub.x,D.sub.y);
 }
 function drawSub(g,x,y){
  g.fillStyle="#ffd23f";g.beginPath();g.ellipse(x,y,34,18,0,0,7);g.fill();
  g.fillStyle="#e8a800";g.fillRect(x-8,y-26,16,10);
  g.fillStyle="#ffd23f";g.beginPath();g.moveTo(x-34,y);g.lineTo(x-48,y-12);g.lineTo(x-48,y+12);g.closePath();g.fill();
  g.fillStyle="#aee6ff";g.beginPath();g.arc(x+8,y-4,10,0,7);g.fill();
  g.fillStyle="#12303f";g.beginPath();g.arc(x+10,y-4,4,0,7);g.fill();
  g.fillStyle="#e8a800";g.fillRect(x-24,y+14,48,4);
  g.fillStyle="#fff";g.font="bold 9px monospace";g.textAlign="center";g.fillText("NEREID",x-2,y+6);
 }
 D.raf=requestAnimationFrame(frame);
}
</script>
<script>
"use strict";
/* ---------- games hub ---------- */
function scrGames(scr){
 scr.appendChild(el("h2",null,"GAMES"));
 function lvl(name,key,state,desc,fn){
  var lv=[["e","Easy"],["m","Medium"],["h","Hard"]];
  var card=el("div","zcard");
  card.appendChild(el("h3",null,name));
  card.appendChild(el("div","small",desc));
  var r=el("div","row");
  lv.forEach(function(L,i){
   var un=i===0||state[lv[i-1][0]]>=3;
   var b=el("button",un?"":"dim",L[1]+(un?"<br><span class='small'>"+(state[L[0]]||0)+"/3 clears</span>":"<br>"+svgI(IC.lock,"#8fb6cc",12)));
   if(un)b.onclick=function(){fn(L[0])};else b.disabled=true;
   r.appendChild(b);
  });
  card.appendChild(r);scr.appendChild(card);
 }
 lvl("Who Am I?","quiz",S.quiz,"Clues appear one at a time. Name the species. 8 of 10 right with 3 lives clears a round.",function(l){go("quiz",l)});
 lvl("Card Memory","mem",S.mem,"Flip cards and match pairs from your collection. Finish the board to clear it.",function(l){go("mem",l)});
 var sc=el("div","zcard");
 sc.appendChild(el("h3",null,"Ocean Sort"));
 sc.appendChild(el("div","small","One species at a time: tap its group - fish, mammal, plant and so on. 10 of 12 right with 3 lives clears. Clears: "+S.sort+"."));
 var r=el("div","row");var b=el("button",null,"Play");b.onclick=function(){go("sort")};r.appendChild(b);sc.appendChild(r);scr.appendChild(sc);
}
/* ---------- quiz ---------- */
function scrQuiz(scr,level){
 var pool=level==="e"?SP.filter(function(s){return s.z===0}):level==="m"?SP.filter(function(s){return s.z<=2}):SP.slice();
 var qs=shuffle(pool.slice()).slice(0,10);
 var qi=0,score=0,lives=3,ci=0,answered=false;
 scr.appendChild(el("h2",null,"WHO AM I? &middot; "+{e:"EASY",m:"MEDIUM",h:"HARD"}[level]));
 var status=el("div","small center");scr.appendChild(status);
 var clues=el("div");scr.appendChild(clues);
 var more=el("button","opt","Show another clue");scr.appendChild(more);
 var opts=el("div");scr.appendChild(opts);
 var sp,answers;
 function cluesFor(sp){var cs=[{t:"Home: "+ZONES[sp.z].n+".",v:"z"+sp.z},{t:"It eats: "+sp.diet+".",v:"d"+sp.diet},{t:"Size: "+sp.size+".",v:"s"+sp.size},{t:sp.fact,v:"f"+sp.id}];
  cs.forEach(function(c){c.n=answers.filter(function(a){return ("z"+a.z)===c.v||("d"+a.diet)===c.v||("s"+a.size)===c.v||("f"+a.id)===c.v}).length});
  cs.sort(function(a,b){return a.n-b.n});return cs.map(function(c){return c.t})}
 function round(){
  if(lives<=0||qi>=10)return end();
  answered=false;ci=0;sp=qs[qi];qi++;
  var others=shuffle(pool.filter(function(s){return s.id!==sp.id})).slice(0,3);
  answers=shuffle([sp].concat(others));
  status.innerHTML="Question "+qi+" / 10 &middot; score "+score+" &middot; lives "+"&#9733;".repeat(lives);
  clues.innerHTML="";opts.innerHTML="";
  addClue();
  more.style.display="";more.onclick=function(){if(ci<4){addClue();sfx("flip")}};
  window.__poQuizSp=sp.id;
  answers.forEach(function(a){
   var b=el("button","opt");b.dataset.sp=a.id;
   var row=el("span");row.style.cssText="display:flex;align-items:center;gap:10px;text-align:left";
   var ic=el("span");ic.style.width="64px";ic.style.flexShrink="0";var qim=photoImg(a,"qphoto");if(qim)ic.appendChild(qim);else drawSprite(ic,a,{});row.appendChild(ic);
   row.appendChild(el("span",null,a.n));
   b.appendChild(row);
   b.onclick=function(){
    if(answered)return;answered=true;
    if(a.id===sp.id){b.classList.add("ok");score++;sfx("ok")}
    else{b.classList.add("no");lives--;sfx("no");
     Array.prototype.forEach.call(opts.children,function(x,i){if(answers[i].id===sp.id)x.classList.add("ok")})}
    setTimeout(round,900);
   };
   opts.appendChild(b);
  });
 }
 function addClue(){var cs=cluesFor(sp);if(ci<cs.length){clues.appendChild(el("div","clue",cs[ci]));ci++}if(ci>=4)more.style.display="none"}
 function end(){
  var pass=score>=8&&lives>0;
  if(pass){S.quiz[level]=(S.quiz[level]||0)+1;save();sfx("clear")}else sfx("no");
  scr.innerHTML="";
  scr.appendChild(el("h2",null,pass?"ROUND CLEARED!":"ROUND OVER"));
  scr.appendChild(el("div","panel","Score: "+score+" / 10. "+(pass?"Clear counted ("+S.quiz[level]+" / 3 on this level).":"You need 8 of 10 with lives left to clear.")));
  var r=el("div","row");
  var b1=el("button","big","Play again");b1.onclick=function(){render("quiz",level)};r.appendChild(b1);
  var b2=el("button","big","Games");b2.onclick=function(){go("games")};r.appendChild(b2);
  scr.appendChild(r);
 }
 round();
}
/* ---------- memory ---------- */
function scrMem(scr,level){
 var pairs=level==="e"?6:level==="m"?8:10;
 var got=SP.filter(function(s){return S.got[s.id]});
 if(got.length<4){
  scr.appendChild(el("div","panel center","Collect at least 4 cards on expeditions to play Card Memory. You have "+got.length+"."));
  var r0=el("div","row");var b0=el("button","big","Go exploring");b0.onclick=function(){go("zones")};r0.appendChild(b0);scr.appendChild(r0);return;
 }
 var use=shuffle(got.slice()).slice(0,Math.min(pairs,got.length));
 pairs=use.length;
 var cards=shuffle(use.concat(use));
 scr.appendChild(el("h2",null,"CARD MEMORY &middot; "+pairs+" PAIRS"));
 var stat=el("div","small center","Find all "+pairs+" pairs to clear the board.");scr.appendChild(stat);
 var grid=el("div","mgrid");grid.style.gridTemplateColumns="repeat(4,1fr)";scr.appendChild(grid);
 var open=[],lock=false,found=0,moves=0;
 cards.forEach(function(sp){
  var b=el("button","mcard");b.dataset.sp=sp.id;
  b.onclick=function(){
   if(lock||b.classList.contains("open")||b.classList.contains("done"))return;
   b.classList.add("open");b.innerHTML="";var mim=photoImg(sp,"mphoto");if(mim)b.appendChild(mim);else drawSprite(b,sp,{});sfx("flip");
   open.push({b:b,sp:sp});
   if(open.length===2){moves++;lock=true;
    if(open[0].sp.id===open[1].sp.id){
     setTimeout(function(){open.forEach(function(o){o.b.classList.add("done")});open=[];lock=false;found++;
      stat.textContent="Pairs: "+found+" / "+pairs+" - moves: "+moves;
      if(found===pairs){S.mem[level]=(S.mem[level]||0)+1;save();sfx("clear");
       stat.innerHTML="<b>Board cleared!</b> Clears on this level: "+S.mem[level]+" / 3.";
       var r=el("div","row");var b1=el("button","big","Play again");b1.onclick=function(){render("mem",level)};r.appendChild(b1);
       var b2=el("button","big","Games");b2.onclick=function(){go("games")};r.appendChild(b2);scr.appendChild(r);}
     },350);
    }else{setTimeout(function(){open.forEach(function(o){o.b.classList.remove("open");o.b.innerHTML=""});open=[];lock=false},800)}
   }
  };
  grid.appendChild(b);
 });
}
/* ---------- sort ---------- */
function scrSort(scr){
 var qs=shuffle(SP.slice()).slice(0,12);
 var qi=0,score=0,lives=3,answered=false;
 scr.appendChild(el("h2",null,"OCEAN SORT"));
 var stat=el("div","small center");scr.appendChild(stat);
 var stage=el("div","panel center");scr.appendChild(stage);
 var cats=el("div","catgrid");scr.appendChild(cats);
 function round(){
  if(lives<=0||qi>=12)return end();
  var sp=qs[qi];qi++;answered=false;window.__poSortCat=sp.cat;
  stat.textContent="Species "+qi+" / 12 - score "+score+" - lives "+lives;
  stage.innerHTML="";
  var ic=el("div");ic.style.width="180px";ic.style.margin="0 auto";var sim=photoImg(sp,"sortphoto");if(sim)ic.appendChild(sim);else drawSprite(ic,sp,{});
  stage.appendChild(ic);
  stage.appendChild(el("div",null,"<b>"+sp.n+"</b>"));
  stage.appendChild(el("div","small","Which group does it belong to? (Game groups, not strict science)"));
  cats.innerHTML="";
  for(var c in CATS)(function(c){
   var b=el("button",null,catIcon(c)+"<span>"+CATS[c]+"</span>");b.dataset.cat=c;
   b.onclick=function(){
    if(answered)return;answered=true;
    if(c===sp.cat){b.classList.add("ok");score++;sfx("ok")}
    else{b.classList.add("no");lives--;sfx("no")}
    Array.prototype.forEach.call(cats.children,function(x){x.disabled=true});
    setTimeout(round,900);
   };
   cats.appendChild(b);
  })(c);
 }
 function end(){
  var pass=score>=10&&lives>0;
  if(pass){S.sort++;save();sfx("clear")}else sfx("no");
  scr.innerHTML="";
  scr.appendChild(el("h2",null,pass?"SORT CLEARED!":"SORT OVER"));
  scr.appendChild(el("div","panel","Score: "+score+" / 12. "+(pass?"Clear counted ("+S.sort+" total).":"You need 10 of 12 with lives left.")));
  var r=el("div","row");
  var b1=el("button","big","Play again");b1.onclick=function(){render("sort")};r.appendChild(b1);
  var b2=el("button","big","Games");b2.onclick=function(){go("games")};r.appendChild(b2);
  scr.appendChild(r);
 }
 round();
}

renderPlayer($("player"));

else if(/^(zones|deck|games|help|sort)$/.test(h0)){NAV.push("home:");NAV.push(h0+":");render(h0)}
else render("home");
</script>
